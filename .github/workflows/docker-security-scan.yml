name: Docker Security Scan

on:
  pull_request:
    paths:
      - 'server/Dockerfile'
      - 'client/Dockerfile'
      - '.github/workflows/docker-security-scan.yml'
  push:
    branches:
      - main
    paths:
      - 'server/Dockerfile'
      - 'client/Dockerfile'
  schedule:
    # Run security scan weekly
    - cron: '0 4 * * 1'
  workflow_dispatch:

# NOTE: Uploading SARIF to GitHub requires the workflow to have the
# 'security-events: write' (or read) permission. Runs from forked PRs
# use a read-only token and cannot access the CodeQL API, so SARIF
# uploads will fail in that case. The top-level permissions below
# ensure the upload step can run for non-fork runs.
permissions:
  contents: read
  security-events: write

jobs:
  scan-server:
    name: Scan Server Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build server image
        run: |
          cd server
          docker build -t ssh-tunnel-server:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ssh-tunnel-server:test'
          format: 'sarif'
          output: 'trivy-server-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-server-results.sarif'
          category: 'server-image'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ssh-tunnel-server:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  scan-client:
    name: Scan Client Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build client image
        run: |
          cd client
          docker build -t ssh-tunnel-client:test .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ssh-tunnel-client:test'
          format: 'sarif'
          output: 'trivy-client-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-client-results.sarif'
          category: 'client-image'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ssh-tunnel-client:test'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
