# NGINX Configuration for Home Assistant SSH Tunnel
# Include cloud-ips.map in nginx.conf http{} block:
#   include /etc/nginx/cloud-ips.map;

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Upstream
upstream homeassistant_tunnel {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN.com;
    
    # SSL
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    
    # Security
    server_tokens off;
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    # Connection limits
    limit_conn conn_limit 10;
    
    # Logs
    access_log /var/log/nginx/homeassistant_access.log;
    error_log /var/log/nginx/homeassistant_error.log warn;
    
    # API endpoints - unified config
    location ~ ^/api/(alexa|google_assistant) {
        # IP whitelist (from cloud-ips.map)
        if ($cloud_allowed = 0) {
            return 403;
        }
        
        # Rate limiting
        limit_req zone=api_limit burst=20 nodelay;
        
        # Proxy to tunnel
        proxy_pass http://homeassistant_tunnel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Deny everything else
    location / {
        deny all;
    }
}
